name: Pulizia versioni vecchie del sito

# Ogni pubblicazione su Cloudflare Pages resta raggiungibile a un suo indirizzo (<codice>.dovai.pages.dev).
# Questo giro, avviato a mano, elenca le versioni vecchie e, solo con «cancella», le cancella per sempre.
# Restano la versione attuale di dovaivoli.it e l'ultima di ogni altro ramo (per esempio prova.dovai.pages.dev).
on:
  workflow_dispatch:
    inputs:
      modalita:
        description: 'elenca (non tocca niente) oppure cancella'
        required: true
        default: elenca
        type: choice
        options: [elenca, cancella]

permissions:
  contents: read

concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Elenca ed eventualmente cancella
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODALITA: ${{ inputs.modalita }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dovai"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          attuale=$(curl -fsS "${auth[@]}" "$api" | jq -r '.result.canonical_deployment.id')
          : > tutte.json
          pagina=1
          while :; do
            r=$(curl -fsS "${auth[@]}" "$api/deployments?page=$pagina&per_page=25")
            n=$(echo "$r" | jq '.result | length')
            [ "$n" -eq 0 ] && break
            echo "$r" | jq -c '.result[] | {id, ramo: .deployment_trigger.metadata.branch, creata: .created_on, alias: (.aliases // [])}' >> tutte.json
            pagina=$((pagina + 1))
          done
          # Da tenere: la versione attuale di main e la più recente di ogni altro ramo (l'elenco arriva dalla più nuova)
          jq -rs --arg a "$attuale" '[.[] | select(.id != $a)] | group_by(.ramo) | map(if .[0].ramo == "main" then . else .[1:] end) | add // [] | sort_by(.creata) | .[] | "\(.id) \(.ramo) \(.creata)"' tutte.json > da_cancellare.txt
          jq -rs --arg a "$attuale" '[.[] | select(.id != $a and .ramo != "main")] | group_by(.ramo) | map(.[0]) | .[] | "\(.id) \(.ramo) \(.creata)"' tutte.json > ultime.txt
          echo "Versioni in tutto: $(wc -l < tutte.json)"
          echo "Versione attuale di dovaivoli.it: $attuale"
          echo "Tenute (ultima di ogni ramo):"; cat ultime.txt
          echo "Da cancellare: $(wc -l < da_cancellare.txt)"
          if [ "$MODALITA" != "cancella" ]; then echo "Modalità elenca: non ho cancellato niente."; exit 0; fi
          fatte=0
          while read -r id ramo creata; do
            curl -fsS -X DELETE "${auth[@]}" "$api/deployments/$id?force=true" > /dev/null && fatte=$((fatte + 1)) || echo "Non cancellata: $id ($ramo, $creata)"
          done < da_cancellare.txt
          echo "Cancellate: $fatte"
