name: Sito dovaivoli.it

on:
  schedule:
    # Minuto non tondo: allo scoccare dell'ora GitHub accoda molte esecuzioni e le ritarda
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sito/**', '.github/workflows/sito.yml']

permissions:
  contents: read

# Un solo giro alla volta: una pubblicazione in corso non va interrotta
concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  pubblica:
    name: Prepara e pubblica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Rifiuta di pubblicare finché nome e città in sito/titolare.js sono vuoti: il passo fallisce e non esce nulla
      - run: node sito/build.js --pubblica
        env:
          CF_BEACON: ${{ vars.CF_BEACON }}
      - name: Pubblica su Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@3 pages deploy sito/dist --project-name dovai --branch main
      - name: Avviso, segreti Cloudflare mancanti
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID, quindi non è stato pubblicato nulla."
