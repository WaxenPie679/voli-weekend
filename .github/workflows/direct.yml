name: Ricerca diretti (Ryanair, Wizz)

on:
  schedule:
    # Minuti non tondi: allo scoccare del quarto d'ora GitHub accoda più esecuzioni e le ritarda
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: direct
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    name: ${{ matrix.gruppo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gruppo: puglia, suffix: '', state: alerts_state_direct.json, branch: history }
          - { gruppo: milano, suffix: '-milano', state: '', branch: history-milano }
          - { gruppo: bergamo, suffix: '-bergamo', state: '', branch: history-bergamo }
          - { gruppo: roma, suffix: '-roma', state: '', branch: history-roma }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-data.sh
      - run: node src/run.js direct --data ./data
        env:
          GRUPPO: ${{ matrix.gruppo }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      # Per i gruppi non Puglia `state` è vuoto: lo stato degli avvisi non si ripubblica mai
      # (il loro checkout del branch data ne ha una copia vecchia che annullerebbe quello di Puglia)
      - if: always()
        run: bash scripts/publish-data.sh ./data direct${{ matrix.suffix }}.json ${{ matrix.state }}
