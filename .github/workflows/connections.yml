name: Ricerca scali (Google Flights)

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:

concurrency:
  group: connections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    name: ${{ matrix.gruppo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gruppo: puglia, suffix: '', state: alerts_state_connections.json, branch: history }
          - { gruppo: milano, suffix: '-milano', state: '', branch: history-milano }
          - { gruppo: bergamo, suffix: '-bergamo', state: '', branch: history-bergamo }
          - { gruppo: roma, suffix: '-roma', state: '', branch: history-roma }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/prepare-data.sh
      - run: node src/run.js connections --data ./data
        env:
          GRUPPO: ${{ matrix.gruppo }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      # Per i gruppi non Puglia `state` è vuoto: lo stato degli avvisi non si ripubblica mai
      # (il loro checkout del branch data ne ha una copia vecchia che annullerebbe quello di Puglia)
      - if: always()
        run: bash scripts/publish-data.sh ./data connections${{ matrix.suffix }}.json ${{ matrix.state }}
