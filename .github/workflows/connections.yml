name: Ricerca scali (Google Flights)

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:

concurrency:
  group: connections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/prepare-data.sh
      - run: node src/run.js connections --data ./data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: bash scripts/publish-data.sh ./data connections.json alerts_state_connections.json
