name: Storico prezzi (Ryanair, Wizz)

on:
  schedule:
    # Minuto non tondo, vedi direct.yml
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: ${{ matrix.gruppo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gruppo: puglia, suffix: '', branch: history }
          - { gruppo: milano, suffix: '-milano', branch: history-milano }
          - { gruppo: bergamo, suffix: '-bergamo', branch: history-bergamo }
          - { gruppo: roma, suffix: '-roma', branch: history-roma }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-history.sh ${{ matrix.branch }}
      # Cartella ./data = branch `data`, dove va il file Premium (Weekend mesi 4–12, Weekend lunghi mesi 1–12)
      # Se non riesce, la raccolta parte lo stesso (solo il file Premium non verrà pubblicato)
      - run: bash scripts/prepare-data.sh
        continue-on-error: true
      # Sotto il timeout del job (120): così il passo di pubblicazione ha tempo di girare
      - run: node src/history/run.js --dir ./history --premium ./data/premium${{ matrix.suffix }}.json
        env:
          GRUPPO: ${{ matrix.gruppo }}
        timeout-minutes: 110
      # Riepilogo per i grafici: se fallisce, i dati del giorno si pubblicano lo stesso
      - id: summary
        if: always() && matrix.gruppo == 'puglia'
        run: node src/history/summary.js --dir ./history --out ./summary
        timeout-minutes: 5
        continue-on-error: true
      - id: publish_history
        if: always()
        run: bash scripts/publish-history.sh ./history ${{ matrix.branch }}
      # File Premium sul branch `data`: se manca o fallisce, lo storico resta pubblicato
      - if: always()
        run: bash scripts/publish-data.sh ./data premium${{ matrix.suffix }}.json
        timeout-minutes: 5
        continue-on-error: true
      # Il riepilogo va sul branch `summary` (un solo commit orfano, sostituito ogni notte),
      # solo se anche i dati del giorno sono stati pubblicati: non deve mostrare un giorno assente da `history`
      - if: always() && matrix.gruppo == 'puglia' && steps.summary.outcome == 'success' && steps.publish_history.outcome == 'success'
        run: bash scripts/publish-summary.sh ./summary
        timeout-minutes: 5
