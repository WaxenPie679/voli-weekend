<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Storico prezzi · Voli Weekend</title>
  <meta name="description" content="Come cambiano nel tempo i prezzi dei voli da Bari e Brindisi, tratta per tratta.">
  <meta name="theme-color" content="#f2f4f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voli Weekend">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="Voli Weekend, offerte">
        <svg class="brand-mark" viewBox="0 0 28 20" aria-hidden="true">
          <path d="M3 1h22a2 2 0 0 1 2 2v4.2a2.8 2.8 0 0 0 0 5.6V17a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-4.2a2.8 2.8 0 0 0 0-5.6V3a2 2 0 0 1 2-2Z" fill="currentColor"/>
          <path d="M19 4.5v11" stroke="#fff" stroke-width="1.4" stroke-dasharray="1.6 1.6"/>
          <path d="M6.5 12.5 13.5 7.5M10.6 7.4l2.9.1-.2 2.9" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Voli Weekend</span>
      </a>
      <nav class="topnav" aria-label="Pagine">
        <a class="nav-link" id="back-link" href="./">Offerte</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="title-row">
      <h1>Storico prezzi</h1>
      <p class="finding" id="status" aria-live="polite">Carico lo storico…</p>
    </div>

    <form class="filters history-filters" id="choice" aria-label="Tratta" hidden>
      <fieldset class="seg-field">
        <legend>Partenza</legend>
        <div class="seg">
          <label><input type="radio" name="base" value="BRI" checked><span>Bari</span></label>
          <label><input type="radio" name="base" value="BDS"><span>Brindisi</span></label>
        </div>
      </fieldset>
      <fieldset class="seg-field">
        <legend>Direzione</legend>
        <div class="seg">
          <label><input type="radio" name="dir" value="out" checked><span>Andata</span></label>
          <label><input type="radio" name="dir" value="back"><span>Ritorno</span></label>
        </div>
      </fieldset>
      <label class="field dest-field">
        <span>Destinazione</span>
        <select name="dest" id="dest"></select>
      </label>
    </form>

    <div id="content" aria-live="polite"></div>

    <template id="route-template">
      <section class="history" aria-labelledby="route-title">
        <div class="history-head">
          <h2 class="route-title" id="route-title"></h2>
          <div class="rise"></div>
        </div>

        <article class="chart-card" aria-labelledby="buy-title">
          <div class="chart-head">
            <h3 id="buy-title">Quando comprare</h3>
            <ul class="legend"></ul>
          </div>
          <p class="chart-sub">Prezzo tipico per settimane prima della partenza: linea = mediana, fascia = metà centrale dei prezzi.</p>
          <div class="chart" data-chart="curve"></div>
          <p class="chart-note">Le prime settimane la curva confronta voli diversi visti lo stesso giorno: con il tempo segue gli stessi voli giorno dopo giorno e diventa più precisa.</p>
        </article>

        <article class="chart-card" aria-labelledby="flight-title">
          <div class="chart-head">
            <h3 id="flight-title">I singoli voli</h3>
            <ul class="legend"></ul>
          </div>
          <label class="field departure-field">
            <span>Data di partenza</span>
            <select class="departure"></select>
          </label>
          <div class="chart" data-chart="steps"></div>
          <p class="chart-note steps-note"></p>
        </article>
      </section>
    </template>
  </main>

  <script type="module" src="storico.js"></script>
</body>
</html>
